name: lexora-community

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexora_community}
      POSTGRES_USER: ${POSTGRES_USER:-lexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - community-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${IMAGE_NAMESPACE:-uselexora}/lexora-api:${IMAGE_TAG:-latest}
    restart: 'no'
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the new community database}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_NAMESPACE:-uselexora}/lexora-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the new community database}
      PUBLIC_ORIGIN: https://${LEXORA_WEB_HOST:-plugins.uselexora.app}
      LEXORA_ADMIN_IDENTITIES: ${LEXORA_ADMIN_IDENTITIES:-}
      OAUTH_PROXY_URL: ${OAUTH_PROXY_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINUX_DO_CLIENT_ID: ${LINUX_DO_CLIENT_ID:-}
      LINUX_DO_CLIENT_SECRET: ${LINUX_DO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

  web:
    image: ${IMAGE_NAMESPACE:-uselexora}/lexora-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'

volumes:
  community-postgres-data:
