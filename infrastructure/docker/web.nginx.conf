limit_req_zone $binary_remote_addr zone=community_api:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 256k;
  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

  location /api/ {
    limit_req zone=community_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 40s;
    access_log off;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }
  location = /index.html {
    expires -1;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
