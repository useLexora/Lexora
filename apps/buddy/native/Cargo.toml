[workspace]
resolver = "3"
members = [
  "host",
  "image",
  "pet"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
png = "0.18.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
windows-sys = "0.61"

# cap-primitives 4.0.3 strips `\\?\` from `\\?\UNC\server\share` and yields an
# invalid `UNC\server\share`, which breaks directory listing and creation on
# \\wsl.localhost. vendor/cap-primitives/README-PATCH.md records the change.
[patch.crates-io]
cap-primitives = { path = "vendor/cap-primitives" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
