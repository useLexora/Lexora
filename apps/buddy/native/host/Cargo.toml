[package]
name = "lexora-buddy-host"

version.workspace = true

edition.workspace = true

publish.workspace = true

autotests = false
autobins = false

[[bin]]
name = "lexora-buddy-file-reader"
path = "src/bin/file_reader.rs"

[[bin]]
name = "lexora-buddy-service-control"
path = "src/bin/service_control.rs"

[[bin]]
name = "lexora-buddy-process-control"
path = "src/bin/process_control.rs"

[[bin]]
name = "lexora-buddy-private-directories"
path = "src/bin/private_directories.rs"

[[bin]]
name = "lexora-buddy-runtime-guard"
path = "src/bin/runtime_guard.rs"

[[bin]]
name = "lexora-buddy-sandbox"
path = "src/bin/shell_sandbox.rs"

[[test]]
name = "file-engine"
path = "__tests__/file_engine.rs"

[[test]]
name = "bounded-file"
path = "__tests__/bounded_file.rs"

[[test]]
name = "bounded-write"
path = "__tests__/bounded_write.rs"

[[test]]
name = "bounded-file-windows"
path = "__tests__/bounded_file_windows.rs"

[[test]]
name = "bounded-file-linux"
path = "__tests__/bounded_file_linux.rs"

[[test]]
name = "bounded-file-macos"
path = "__tests__/bounded_file_macos.rs"

[[test]]
name = "process-control-linux"
path = "__tests__/process_control_linux.rs"

[[test]]
name = "supervised-shell-linux"
path = "__tests__/supervised_shell_linux.rs"

[[test]]
name = "sandbox-ipc-linux"
path = "__tests__/sandbox_ipc_linux.rs"

[[test]]
name = "installer-process-windows"
path = "__tests__/installer_process_windows.rs"

[[example]]
name = "sandbox-adversary"
path = "__tests__/sandbox_adversary.rs"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = [
  "fs",
  "process",
  "event",
  "system",
  "time",
  "param"
] }
chrono = { version = "0.4", default-features = false, features = [ "std" ] }

[dependencies]
cap-std = "4"
notify = "8.2"
rusqlite = { version = "0.40", features = [ "bundled" ] }
sha2 = "0.10"
uuid = { version = "1", features = [ "v4" ] }
trash = "5.2"

serde.workspace = true

serde_json.workspace = true

thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1", features = [ "fs" ] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL"
] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
cap-primitives = "4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell"
] }
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_WindowsProgramming",
  "Win32_System_Services",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Rpc",
  "Win32_UI_Shell",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
