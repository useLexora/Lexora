name: Draft Lexora Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version on master to build into a draft; no existing tag or Release
        type: string
        required: true
  push:
    branches:
      - master
    paths:
      - apps/buddy/buddy.version.json

permissions:
  contents: read

concurrency:
  group: lexora-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.transition.outputs.commit }}
      tag: ${{ steps.transition.outputs.tag }}
      version: ${{ steps.transition.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate release source
        id: transition
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RECOVERY_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$RELEASE_REF" != refs/heads/master ]]; then
              echo "Release recovery must run from master" >&2
              exit 1
            fi
            node packaging/release/version.mjs --check-tag "v$RECOVERY_VERSION"
            {
              echo "commit=$AFTER_SHA"
              echo "tag=v$RECOVERY_VERSION"
              echo "version=$RECOVERY_VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            node packaging/release/transition.mjs \
              --check "$BEFORE_SHA" "$AFTER_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Require unused release identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.transition.outputs.tag }}
        run: |
          require_missing() {
            local label="$1"
            local endpoint="$2"
            local lookup_error="$RUNNER_TEMP/lexora-$label-lookup.error"
            if gh api "$endpoint" >/dev/null 2>"$lookup_error"; then
              echo "Release $label already exists for $TAG" >&2
              exit 1
            fi
            if ! grep -q 'HTTP 404' "$lookup_error"; then
              cat "$lookup_error" >&2
              exit 1
            fi
          }

          require_missing tag "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          require_missing release "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"

  packages:
    name: Package verification
    needs: validate-release
    uses: ./.github/workflows/buddy-build.yml
    with:
      upload-artifacts: true

  macos:
    name: macOS package verification
    needs: validate-release
    uses: ./.github/workflows/macos-verify.yml
    with:
      signing: ad-hoc

  draft-release:
    name: Prepare Release draft
    needs: [validate-release, packages, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download verified Ubuntu package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexora-buddy-ubuntu
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Ubuntu ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexora-buddy-ubuntu-arm64
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Arch package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexora-buddy-arch
          path: apps/buddy/.output/artifacts/arch

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexora-buddy-windows
          path: apps/buddy/.output/artifacts/windows

      - name: Download verified Windows ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexora-buddy-windows-arm64
          path: apps/buddy/.output/artifacts/windows

      - name: Download verified macOS ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lexora-buddy-macos-arm64
          path: apps/buddy/.output/artifacts/macos

      - name: Reconstruct release metadata and checksums
        run: |
          node packaging/buddy/release/verify-release-artifacts.mjs --github-env "$GITHUB_ENV"

      - name: Bind artifacts to validated transition
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
          EXPECTED_TAG: ${{ needs.validate-release.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          if [[ "$LEXORA_BUDDY_RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Artifact tag does not match validated release transition" >&2
            exit 1
          fi
          if [[ "$LEXORA_BUDDY_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Artifact version does not match validated release transition" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]]; then
            echo "Draft checkout does not match validated release commit" >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/apps/buddy/.output/artifacts/desktop/*.deb
            ${{ github.workspace }}/apps/buddy/.output/artifacts/arch/*.pkg.tar.zst
            ${{ github.workspace }}/apps/buddy/.output/artifacts/windows/*.exe
            ${{ github.workspace }}/apps/buddy/.output/artifacts/macos/*.dmg
            ${{ github.workspace }}/apps/buddy/.output/artifacts/SHA256SUMS.txt

      - name: Stage verified assets and release notes draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/buddy/release/github-release.mjs --stage
