name: Lexora CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
    paths:
      - .github/workflows/ci.yml
      - .github/scripts/resolve-ci-scope.mjs
      - .github/scripts/buddy-test-runtime.mjs
      - .cargo/**
      - rust-toolchain*
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/buddy/package.json
      - apps/buddy/native/**
      - apps/buddy/platform/native/**
      - apps/buddy/platform/targets.json
      - apps/buddy/shared/platform/**
      - apps/buddy/resources/icons/app-icon.png
      - packages/assets/buddy/pets/default/**
      - packaging/buddy/release/native-host.mjs
      - packaging/buddy/release/targets.mjs

permissions:
  contents: read

env:
  BUDDY_RUST_TOOLCHAIN: 1.98.0

concurrency:
  group: lexora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.resolve.outputs.workspace }}
      native: ${{ steps.resolve.outputs.native }}
      website: ${{ steps.resolve.outputs.website }}
      repository: ${{ steps.resolve.outputs.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve change scope
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node .github/scripts/resolve-ci-scope.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  website-quality:
    name: Website quality
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora --filter @uselexora/lexora-website install --frozen-lockfile

      - name: Lint workspace
        run: pnpm --filter @uselexora/lexora-website lint

      - name: Type-check workspace
        run: pnpm --filter @uselexora/lexora-website type-check

  repository-checks:
    name: Repository checks
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora install --frozen-lockfile

      - name: Lint repository
        run: >-
          pnpm exec eslint eslint.config.js .github/scripts packages/assets packaging infrastructure/scripts
          --ignore-pattern 'packaging/buddy/**'

  workspace-checks:
    name: Workspace checks
    needs: [scope, native-test-runtime]
    if: github.event_name == 'pull_request' && needs.scope.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora --filter '@uselexora/lexora-buddy...' install --frozen-lockfile

      - name: Lint workspace
        run: pnpm exec eslint apps/buddy packaging/buddy

      - name: Type-check workspace
        run: pnpm --filter @uselexora/lexora-buddy type-check

      - name: Download native test runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-test-runtime-linux
          path: ${{ runner.temp }}/buddy-test-runtime

      - name: Prepare test tools
        run: |
          tar -xf "$RUNNER_TEMP/buddy-test-runtime/buddy-test-runtime.tar" -C apps/buddy
          node packaging/buddy/release/search-tools.mjs
          sudo apt-get install -y socat
          if sudo apparmor_status --enabled; then
            sandbox_binary="$(realpath apps/buddy/.output/build/shell-sandbox/linux-x64/bwrap)"
            printf 'abi <abi/4.0>,\nprofile lexora-buddy-test-shell "%s" flags=(unconfined) { userns, }\n' "$sandbox_binary" | sudo apparmor_parser --replace
          fi

      - name: Test workspace
        run: pnpm --filter @uselexora/lexora-buddy test

  native-test-runtime:
    name: Native test runtime
    needs: scope
    if: needs.scope.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.BUDDY_RUST_TOOLCHAIN }}

      - name: Cache Rust runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/buddy/.output/build/native
          key: buddy-runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.BUDDY_RUST_TOOLCHAIN }}-${{ hashFiles('apps/buddy/native/Cargo.lock') }}-${{ hashFiles('.cargo/**', 'rust-toolchain*', 'apps/buddy/native/**', 'apps/buddy/platform/native/nativeHost.json', 'apps/buddy/platform/targets.json', 'packaging/buddy/release/native-host.mjs', 'packaging/buddy/release/targets.mjs') }}
          restore-keys: |
            buddy-runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.BUDDY_RUST_TOOLCHAIN }}-${{ hashFiles('apps/buddy/native/Cargo.lock') }}-

      - name: Prepare native test programs
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev meson ninja-build
          node .github/scripts/buddy-test-runtime.mjs "$RUNNER_TEMP/buddy-test-runtime.tar"

      - name: Upload native test runtime
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-runtime-linux
          path: ${{ runner.temp }}/buddy-test-runtime.tar
          if-no-files-found: error
          retention-days: 1

  native-checks:
    name: Native checks (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: darwin-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/buddy/.output/build/native
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.BUDDY_RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve native target
        id: target
        shell: bash
        run: node packaging/buddy/release/targets.mjs --target "${{ matrix.target }}" --github-output "$GITHUB_OUTPUT"

      - name: Cache Rust tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/buddy/.output/build/native
          key: native-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.BUDDY_RUST_TOOLCHAIN }}-${{ hashFiles('apps/buddy/native/Cargo.lock') }}-${{ hashFiles('.cargo/**', 'rust-toolchain*', 'apps/buddy/native/**', 'apps/buddy/resources/icons/app-icon.png', 'packages/assets/buddy/pets/default/**') }}
          restore-keys: |
            native-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.BUDDY_RUST_TOOLCHAIN }}-${{ hashFiles('apps/buddy/native/Cargo.lock') }}-

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libgtk-layer-shell-dev libxdo-dev

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/buddy/native/Cargo.toml --all -- --check

      - name: Lint native components
        run: cargo clippy --locked --manifest-path apps/buddy/native/Cargo.toml --workspace ${{ steps.target.outputs.cargo-args }} --all-targets -- -D warnings

      - name: Test native components
        run: cargo test --locked --manifest-path apps/buddy/native/Cargo.toml --workspace ${{ steps.target.outputs.cargo-args }}

      - name: Build Windows sandbox acceptance runtime
        if: runner.os == 'Windows'
        run: cargo build --locked --release --manifest-path apps/buddy/native/Cargo.toml --package lexora-buddy-host --bin lexora-buddy-sandbox --example sandbox-adversary --target ${{ steps.target.outputs.rust-target }}

      - name: Verify Windows sandbox with a non-administrator token
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./packaging/buddy/release/verify-windows-sandbox.ps1
          -SandboxExecutable ./apps/buddy/.output/build/native/${{ steps.target.outputs.rust-target }}/release/lexora-buddy-sandbox.exe
          -AdversaryExecutable ./apps/buddy/.output/build/native/${{ steps.target.outputs.rust-target }}/release/examples/sandbox-adversary.exe
          -InstallComponent

  workspace-dependency-cache:
    name: Workspace dependency cache
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora --filter '@uselexora/lexora-buddy...' install --frozen-lockfile

  ci-gate:
    name: CI Gate
    needs: [scope, website-quality, repository-checks, native-test-runtime, workspace-checks, native-checks]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks
        env:
          WORKSPACE_REQUIRED: ${{ needs.scope.outputs.workspace }}
          WORKSPACE_RESULT: ${{ needs.workspace-checks.result }}
          RUNTIME_RESULT: ${{ needs.native-test-runtime.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.native }}
          RUST_RESULT: ${{ needs.native-checks.result }}
          WEBSITE_REQUIRED: ${{ needs.scope.outputs.website }}
          WEBSITE_RESULT: ${{ needs.website-quality.result }}
          REPOSITORY_REQUIRED: ${{ needs.scope.outputs.repository }}
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          require_success() {
            local label="$1"
            local required="$2"
            local result="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "$label did not succeed: $result" >&2
              exit 1
            fi
          }

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Scope did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi

          require_success "Website quality" "$WEBSITE_REQUIRED" "$WEBSITE_RESULT"
          require_success "Repository checks" "$REPOSITORY_REQUIRED" "$REPOSITORY_RESULT"
          require_success "Workspace checks" "$WORKSPACE_REQUIRED" "$WORKSPACE_RESULT"
          require_success "Native test runtime" "$WORKSPACE_REQUIRED" "$RUNTIME_RESULT"
          require_success "Native checks" "$RUST_REQUIRED" "$RUST_RESULT"
