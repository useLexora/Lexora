name: Package verification

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload verified packages for downstream release jobs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ubuntu:
    name: Ubuntu package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcap-dev \
            meson \
            ninja-build \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libxdo-dev \
            libarchive-tools \
            xvfb

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora --filter '@uselexora/lexora-buddy...' install --frozen-lockfile

      - name: Resolve package target
        id: package
        shell: bash
        run: |
          node packaging/buddy/release/targets.mjs --target "${{ matrix.target }}" --github-output "$GITHUB_OUTPUT"
          node packaging/buddy/release/artifacts.mjs --format deb --github-output "$GITHUB_OUTPUT"

      - name: Test native components
        run: cargo test --locked --manifest-path apps/buddy/native/Cargo.toml --target-dir apps/buddy/.output/build/native --workspace ${{ steps.package.outputs.cargo-args }}

      - name: Build Ubuntu package
        run: pnpm --filter @uselexora/lexora-buddy package:deb

      - name: Install built Desktop deb
        id: install
        run: sudo apt-get install -y "${{ steps.package.outputs.path }}"

      - name: Smoke installed Desktop and native pet
        id: smoke
        timeout-minutes: 2
        env:
          LEXORA_BUDDY_PET_PATH: /opt/lexora-buddy/resources/native-pet/lexora-buddy-pet
          LEXORA_DESKTOP_EXECUTABLE_PATH: /opt/lexora-buddy/lexora-buddy
        run: xvfb-run -a node packaging/buddy/ci/run-gui-smoke.mjs

      - name: Upload verified Ubuntu package
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  build-arch:
    name: Arch package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm base-devel git gtk3 libarchive libcap meson ninja libxcrypt-compat

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora --filter '@uselexora/lexora-buddy...' install --frozen-lockfile

      - name: Resolve package target
        id: package
        run: |
          node packaging/buddy/release/targets.mjs --target linux-x64 --github-output "$GITHUB_OUTPUT"
          node packaging/buddy/release/artifacts.mjs --format pacman --github-output "$GITHUB_OUTPUT"

      - name: Build first-party Arch package
        run: pnpm --filter @uselexora/lexora-buddy package:arch

      - name: Upload Arch package for installation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-install-candidate
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  verify-arch:
    name: Arch install
    needs: build-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve package target
        id: package
        run: node packaging/buddy/release/artifacts.mjs --format pacman --github-output "$GITHUB_OUTPUT"

      - name: Download Arch package for installation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arch-install-candidate
          path: apps/buddy/.output/artifacts/arch

      - name: Install built Arch package in an isolated container
        env:
          ARCH_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          printf 'abi <abi/4.0>,\nprofile lexora-arch-install flags=(unconfined) { userns, }\n' > "$RUNNER_TEMP/lexora-arch-install.apparmor"
          sudo apparmor_parser --replace "$RUNNER_TEMP/lexora-arch-install.apparmor"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --detach --name lexora-arch-install \
            --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=lexora-arch-install \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$node_root:/opt/node:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env ARCH_PACKAGE \
            --env PATH=/opt/node/bin:/usr/bin:/bin \
            archlinux:latest sleep infinity
          docker exec lexora-arch-install bash -euc '
            pacman -Syu --noconfirm dbus xorg-server-xvfb xorg-xauth
            pacman -U --noconfirm "$ARCH_PACKAGE"
            useradd -m buddy
            install -d -m 700 -o buddy -g buddy /home/buddy/runtime
          '

      - name: Smoke installed Desktop and native pet
        timeout-minutes: 2
        run: |
          docker exec --user buddy \
            --env HOME=/home/buddy \
            --env XDG_RUNTIME_DIR=/home/buddy/runtime \
            --env LEXORA_GUI_SMOKE_NO_SANDBOX=1 \
            --env LEXORA_BUDDY_PET_PATH=/opt/lexora-buddy/resources/native-pet/lexora-buddy-pet \
            --env LEXORA_DESKTOP_EXECUTABLE_PATH=/opt/lexora-buddy/lexora-buddy \
            lexora-arch-install \
            xvfb-run -a dbus-run-session -- node packaging/buddy/ci/run-gui-smoke.mjs

      - name: Remove installation container and policy
        if: always()
        run: |
          if docker container inspect lexora-arch-install > /dev/null 2>&1; then
            docker rm --force lexora-arch-install
          fi
          if [[ -f "$RUNNER_TEMP/lexora-arch-install.apparmor" ]]; then
            sudo apparmor_parser --remove "$RUNNER_TEMP/lexora-arch-install.apparmor"
          fi

      - name: Upload verified Arch package
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Windows package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - name: Install workspace dependencies
        run: pnpm --filter @uselexora/lexora --filter '@uselexora/lexora-buddy...' install --frozen-lockfile

      - name: Resolve package target
        id: package
        shell: bash
        run: |
          node packaging/buddy/release/targets.mjs --target "${{ matrix.target }}" --github-output "$GITHUB_OUTPUT"
          node packaging/buddy/release/artifacts.mjs --format nsis --github-output "$GITHUB_OUTPUT"

      - name: Test native components
        run: cargo test --locked --manifest-path apps/buddy/native/Cargo.toml --target-dir apps/buddy/.output/build/native --workspace ${{ steps.package.outputs.cargo-args }}

      - name: Build Windows package
        run: pnpm --filter @uselexora/lexora-buddy package:windows

      - name: Test platform runtime
        run: pnpm --filter @uselexora/lexora-buddy test:platform

      - name: Install built NSIS package
        id: install
        timeout-minutes: 3
        run: |
          $installer = Start-Process -FilePath '${{ steps.package.outputs.path }}' -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed: $($installer.ExitCode)" }
          $directory = Join-Path $env:LOCALAPPDATA 'Programs\Lexora Buddy'
          if (!(Test-Path -LiteralPath (Join-Path $directory 'Lexora Buddy.exe'))) {
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object DisplayName -Like '*Lexora*' |
              Select-Object DisplayName, InstallLocation, UninstallString | Format-List
            Get-ChildItem -LiteralPath $directory -ErrorAction SilentlyContinue | Select-Object Name, Length
            throw "Installed Desktop is missing at $directory; NSIS exit code: $($installer.ExitCode)"
          }
          "BUDDY_INSTALL_DIRECTORY=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke installed Windows Desktop
        id: smoke
        timeout-minutes: 3
        run: node packaging/buddy/ci/verify-windows-install.mjs "$env:BUDDY_INSTALL_DIRECTORY"

      - name: Build Windows sandbox acceptance fixture
        run: cargo build --locked --release --manifest-path apps/buddy/native/Cargo.toml --target-dir apps/buddy/.output/build/native --package lexora-buddy-host --example sandbox-adversary --target ${{ steps.package.outputs.rust-target }}

      - name: Verify installed sandbox with a standard user
        timeout-minutes: 12
        run: >-
          ./packaging/buddy/release/verify-windows-sandbox.ps1
          -SandboxExecutable "$env:BUDDY_INSTALL_DIRECTORY/resources/native-host/lexora-buddy-sandbox.exe"
          -AdversaryExecutable ./apps/buddy/.output/build/native/${{ steps.package.outputs.rust-target }}/release/examples/sandbox-adversary.exe
          -InstallerExecutable "${{ steps.package.outputs.path }}"
          -InstallComponent

      - name: Upload verified Windows package
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
