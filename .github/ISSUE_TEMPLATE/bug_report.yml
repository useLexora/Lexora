name: 缺陷报告 / Bug report
description: 报告使用中遇到的问题 / Report a problem you encountered
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        可使用中文或 English，只需描述遇到的问题，其余信息按需补充；偶发或暂时无法复现的问题也欢迎反馈。提交前可搜索已有 Issue。

        Write in Chinese or English. Only the problem description is required; add other details if available. Intermittent issues are welcome too. Consider searching existing issues before submitting.

        疑似安全漏洞请通过[私密漏洞报告](https://github.com/useLexora/Lexora/security/advisories)提交。日志和截图请移除密钥、个人路径等敏感信息。

        Report suspected vulnerabilities [privately](https://github.com/useLexora/Lexora/security/advisories). Remove keys, personal paths, and other sensitive details from logs and screenshots.
  - type: textarea
    id: actual
    attributes:
      label: 遇到的问题 / What happened
      description: 描述你在做什么、遇到了什么问题，可附截图或错误消息。 / Describe what you were doing and what went wrong. Screenshots or error messages are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤（选填） / Steps to reproduce (optional)
      description: 如果知道如何触发，请列出操作步骤；无法复现也可以提交。 / If you know how to trigger the issue, list the steps. You can submit even if you cannot reproduce it.
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: 预期结果（选填） / Expected behavior (optional)
      description: 描述你原本希望发生的结果。 / Describe what you expected to happen.
  - type: input
    id: version
    attributes:
      label: Lexora 版本（选填） / Lexora version (optional)
      description: 不清楚可留空。 / Leave blank if unsure.
      placeholder: "e.g. 0.12.0"
  - type: input
    id: environment
    attributes:
      label: 运行环境（选填） / Environment (optional)
      description: 系统或浏览器；知道的话也可补充安装或部署方式。 / OS or browser; add the installation or deployment method if known.
      placeholder: "e.g. Windows 11, macOS 15, Chrome"
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（选填） / Additional context (optional)
      description: 可附脱敏日志、录屏、上次正常版本；AI 相关问题可补充服务商、模型或工具名称。 / Add redacted logs, recordings, or the last working version. For AI issues, provider, model, or tool names may help.
