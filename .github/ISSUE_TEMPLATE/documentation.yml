name: 文档问题 / Documentation issue
description: 报告缺失、过时或不清楚的文档 / Report missing, outdated, or unclear documentation
title: "[Docs] "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。可使用中文或 English，并提供具体页面或文件，方便定位。

        Please search existing issues first. You may write in Chinese or English. Include the specific page or file so we can find it.
  - type: input
    id: location
    attributes:
      label: 文档位置 / Documentation location
      description: 页面链接、标题或仓库路径。 / Page URL, heading, or repository path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / Problem
      description: 哪一步不准确、不清楚或缺失？ / What is inaccurate, unclear, or missing?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 需要的信息 / Information needed
      description: 你希望文档能帮助你完成什么？ / What should the documentation help you do?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 修改建议 / Suggested change
      description: 如有，可提供改写建议或示例。 / If you have one, add suggested wording or an example.
