name: 文档问题 / Documentation issue
description: 报告缺失、过时或不清楚的文档 / Report missing, outdated, or unclear documentation
title: "[Docs] "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        可使用中文或 English，描述哪里不清楚、缺少什么信息即可；其余按需补充。

        Write in Chinese or English. Describe what is unclear or missing; other details are optional.
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / Problem
      description: 哪一步不准确、不清楚或缺失？ / What is inaccurate, unclear, or missing?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 文档位置（选填） / Documentation location (optional)
      description: 如有，可提供页面链接、标题或文件路径。 / Add a page URL, heading, or file path if available.
  - type: textarea
    id: suggestion
    attributes:
      label: 修改建议或需要的信息（选填） / Suggested change or information needed (optional)
      description: 你希望文档补充什么？也可提供改写建议或示例。 / What should the documentation explain? Suggested wording or examples are welcome.
