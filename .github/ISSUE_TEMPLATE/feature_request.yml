name: 功能建议 / Feature request
description: 描述使用场景与希望改进的体验 / Suggest an improvement to the product experience
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        可使用中文或 English，简单说说你想解决什么问题或希望增加什么功能即可。提交前可搜索已有建议。

        Write in Chinese or English. Briefly describe the problem you want to solve or the feature you would like. Consider searching existing requests first.
  - type: textarea
    id: problem
    attributes:
      label: 你的建议 / Your suggestion
      description: 想增加或改进什么？如果方便，也说说使用场景。 / What would you like to add or improve? Include a use case if you can.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望的体验（选填） / Desired outcome (optional)
      description: 从用户角度描述完成后的行为。 / Describe how the product should behave from the user's perspective.
  - type: textarea
    id: context
    attributes:
      label: 补充信息（选填） / Additional context (optional)
      description: 可附当前做法、示例、截图或相关 Issue。 / Add a workaround, examples, screenshots, or related issues.
