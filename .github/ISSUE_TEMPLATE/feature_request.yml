name: 功能建议 / Feature request
description: 描述使用场景与希望改进的体验 / Suggest an improvement to the product experience
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。可使用中文或 English，重点说明使用场景和希望达到的结果，不需要先设计技术实现。

        Please search existing issues first. You may write in Chinese or English. Focus on the use case and desired outcome; a technical design is not required.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: 提交前 / Before submitting
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。 / I searched existing issues for similar requests.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围 / Affected area
      options:
        - Desktop (Buddy)
        - Website
        - Self-hosted Web / API / Agent
        - Other / 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 你在做什么任务？目前哪个步骤不顺畅？ / What are you trying to do, and where does the current experience fall short?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望的体验 / Desired outcome
      description: 从用户角度描述完成后的行为。 / Describe how the product should behave from the user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法或替代方案 / Current workaround or alternatives
      description: 如有，请说明现在如何完成任务。 / If applicable, explain how you complete the task today.
  - type: textarea
    id: context
    attributes:
      label: 补充材料 / Additional context
      description: 可附示例、截图或相关 Issue。 / Add examples, screenshots, or related issues.
